platform:
  target: rpi5

camera:
  id: imx708-main
  source:
    backend: libcamera
    camera_index: 0
  video:
    width: 1920
    height: 1080
    fps: 50
    format: nv12
  encoder:
    backend: x264
    bitrate_kbps: 6000
    gop: 25
    preset: ultrafast
  ai:
    enabled: true
    model_ids: [objects, pose]

http:
  enabled: true
  bind_ip: 0.0.0.0
  port: 8443
  web_root: web/dist
  public_base_url: http://127.0.0.1:8443
  live:
    enabled: true
    fragment_duration_ms: 500
    max_clients: 4
    ring_fragments: 8
    stale_timeout_ms: 2000
  tls:
    enabled: false

security:
  enabled: false
  audit:
    max_events: 50000
    warning_percent: 90

self_protection:
  manifest_path: /var/lib/camera-firmware/integrity/manifest.yaml
  signature_path: /var/lib/camera-firmware/integrity/manifest.sig
  interval_hours: 24

ai:
  enabled: true
  backend: hailo
  models:
    - id: objects
      kind: object_detection
      hef_path: vendor/models/yolo_model.hef
      input:
        width: 640
        height: 640
        format: rgb8
        letterbox: true
      confidence_threshold: 0.40
      labels: coco80
    - id: pose
      kind: pose
      hef_path: vendor/models/yolov8n-pose.hef
      output_name: yolov8_pose_postprocess
      input:
        width: 640
        height: 640
        format: rgb8
        letterbox: true
      confidence_threshold: 0.35
      labels: pose17

secure_rtsp:
  enabled: true
  control_tls: true
  keying: sdes-over-rtsps
  allow_development_self_signed_tls: true
  media_srtp: true
  bind_ip: 0.0.0.0
  port: 8555
  mount: /imx708/main
  client_auth:
    enabled: false
    realm: rpi-camera
    credential_file: config/rtsp-digest.credentials
    algorithms: [sha-256]
    nonce_ttl_seconds: 300
  session_key:
    source: file
    path: config/dev-srtp-session.hex
    encoding: hex
    zeroize_on_reload: true
